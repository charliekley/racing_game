<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tilt Kart – Host</title>
  </head>
  <body>
    <div id="app">
      <header class="title">
        <h1 class="logo" aria-label="Tilt Kart">
          <span class="logo-word"><i>T</i><i>I</i><i>L</i><i>T</i></span>
          <span class="logo-word"><i>K</i><i>A</i><i>R</i><i>T</i></span>
        </h1>
        <div class="checker"></div>
        <p class="subtitle">Grab your phone, scan the code, steer like a wheel</p>
        <!-- Opens the settings panel (src/host/settingsPanel.ts); the text is a read-only summary of the current settings. -->
        <button type="button" id="settings-open" class="settings-open" aria-label="Settings">
          <span class="gear">&#9881;</span><span id="settings-summary" class="summary"></span>
        </button>
      </header>

      <main class="lobby">
        <section class="join-panel">
          <div class="qr-frame">
            <canvas id="qr" width="280" height="280" aria-label="QR code to join"></canvas>
          </div>
          <div class="room-label">ROOM CODE</div>
          <div id="room-code" class="room-code">····</div>
          <a id="join-url" class="join-url" target="_blank" rel="noopener"></a>
          <div id="net-status" class="net-status">Connecting to signaling server…</div>
        </section>

        <div class="right-col">
          <div class="top-row">
          <section class="mode-panel" aria-label="Race mode">
            <div class="mode-label">MODE</div>
            <div id="mode-pills" class="mode-pills"></div>
            <div id="mode-note" class="mode-note"></div>
          </section>
          <section class="track-panel" aria-label="Track">
            <button id="track-prev" class="arrow" tabindex="-1" title="Previous track">&#9664;</button>
            <canvas id="track-map" width="220" height="130"></canvas>
            <img id="track-shot" alt="" hidden />
            <div class="track-info">
              <div class="track-label">TRACK</div>
              <div id="track-name" class="track-name"></div>
              <div id="track-meta" class="track-meta"></div>
            </div>
            <button id="track-next" class="arrow" tabindex="-1" title="Next track">&#9654;</button>
          </section>
          </div>
          <!-- Selection screen: one quadrant per player (name -> character -> kart -> ready), drawn by src/host/selectView.ts -->
          <section id="select" class="select-area" aria-label="Player selection"></section>
          <!-- Old player cards (debug readout, remove buttons): kept in the page but hidden; see lobby.css -->
          <section id="slots" class="slots"></section>
        </div>
      </main>

      <div id="lobby-hint" class="lobby-hint"></div>
      <div id="banner" class="banner hidden"></div>

    </div>
    <!-- 3D view (shown while driving) -->
    <div id="game" class="game hidden"></div>
    <div id="fps" class="fps"></div>
    <script type="module" src="../src/host/main.ts"></script>
  </body>
</html>
