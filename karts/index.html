<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tilt Kart – Kart Garage</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfeaff; font-family: system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .label {
        position: absolute; transform: translate(-50%, -100%); width: 18vw; max-width: 170px; box-sizing: border-box; text-align: center;
        color: #fff; background: rgba(15, 18, 38, 0.78); padding: 4px 10px; border-radius: 8px;
      }
      .label b { display: block; font-size: 16px; font-style: italic; letter-spacing: 0.08em; color: #ffbe0b; }
      .label span { font-size: 11px; color: #c9cff5; }
      #panel {
        position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        color: #f4f5ff; background: rgba(15, 18, 38, 0.82); padding: 10px 12px; border-radius: 12px; font-size: 13px;
      }
      #panel h1 { margin: 0 8px 0 0; font-size: 16px; font-style: italic; letter-spacing: 0.12em; color: #ffbe0b; }
      #panel button {
        font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; background: #3a86ff; color: #fff;
      }
      #panel a { color: #9aa3d6; margin-left: auto; }
      #stats { color: #9aa3d6; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="labels"></div>
    <div id="panel">
      <h1>KART GARAGE</h1>
      <button id="colors" type="button">Next colors</button>
      <button id="spin" type="button">Pause spin</button>
      <button id="markers" type="button">Show effect markers</button>
      <span id="stats"></span>
      <a href="../">← back</a>
    </div>
    <script type="module" src="/src/dev/kartPreview.ts"></script>
  </body>
</html>
