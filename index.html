<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tilt Kart</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1226; color: #f4f5ff; font-family: system-ui, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 16px; box-sizing: border-box; text-align: center; }
      h1 { font-style: italic; letter-spacing: 0.15em; color: #ffbe0b; margin: 0; }
      a { display: block; width: min(320px, 100%); padding: 18px; border-radius: 14px; font-size: 22px; font-weight: 800; text-decoration: none; color: #111; }
      .host { background: #ffbe0b; }
      .ctrl { background: #3a86ff; color: #fff; }
      p { color: #9aa3d6; max-width: 32em; }
    </style>
  </head>
  <body>
    <main>
      <h1>TILT KART</h1>
      <a class="host" href="host/">📺 Host a game (TV / laptop)</a>
      <a class="ctrl" href="controller/">📱 Join as controller (phone)</a>
      <p>Open "Host" on the computer connected to the TV, then scan the QR code with each phone.</p>
    </main>
  </body>
</html>
